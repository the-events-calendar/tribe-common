significance: patch
type: fix
entry: Avoided a fatal error on sites with a database table prefix of 31 or more
  characters, where the migrations table name exceeded the 64-character MySQL
  limit, and added an admin notice explaining how to shorten the prefix. The
  Shepherd tables error notice was also corrected so it no longer caused an
  error when displayed.
